name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          # 1. Explicitly list what you want in 'base' and ensure 'projects' isn't there
          base: header, repositories, metadata
          
          # 2. Add this line to force the action to skip the deprecated projects query
          repositories_batch: 100 
          
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_habits: yes
          plugin_habits_charts: yes
          
          # 3. Keep this as 'no' and consider if you actually need v2 
          # (v2 requires the 'project' scope on your PAT)
          plugin_projects: no
          plugin_projects_v2: no 
          
          plugin_achievements: yes
